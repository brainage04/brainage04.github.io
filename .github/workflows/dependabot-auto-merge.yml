name: Dependabot auto-merge

# Minor and patch npm updates from Dependabot merge on their own once the checks required by the "Require checks"
# ruleset on main have passed. Major updates and GitHub Actions updates stay open for review, because the
# GITHUB_TOKEN may not merge a pull request that edits a workflow. pull_request_target runs this file from the
# default branch with a write token. It never checks out the pull request's code.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for minor and patch updates
        if: (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch') && steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
