name: Dependabot auto-merge

# Minor and patch npm updates from Dependabot merge on their own once Validate has passed on the update's commit.
# Major updates and GitHub Actions updates stay open for review, because the GITHUB_TOKEN may not merge a pull
# request that edits a workflow.
#
# The other sites gate `gh pr merge --auto` with a "Require checks" ruleset. Here a ruleset would block
# sync-projects.yml, which pushes to main with the GITHUB_TOKEN, because a personal repository's ruleset cannot let
# GitHub Actions bypass it.
# So this workflow checks Validate itself, started by workflow_run when Validate finishes. fetch-metadata reads only
# pull_request payloads (v3.1.0 src/dependabot/verified_commits.ts:16), so the pull_request_target run marks a minor
# or patch update's commit with a status, and whichever of the two runs comes last merges. Both events run this file
# from main with a write token, and it never checks out the pull request's code.
on:
  pull_request_target:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Read the update type
        id: metadata
        if: github.event_name == 'pull_request_target'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Mark minor and patch updates
        id: mark
        if: (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch') && steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: >-
          gh api "repos/$GH_REPO/statuses/$SHA" -f state=success -f context='Dependabot auto-merge'
          -f description='Minor or patch update, merges once Validate passes'

      - name: Merge once the update is marked and Validate has passed
        if: github.event_name == 'workflow_run' || steps.mark.outcome == 'success'
        run: |
          if [ -z "$PR" ]; then
            echo "No pull request for $SHA."
            exit 0
          fi
          marked=$(gh api "repos/$GH_REPO/commits/$SHA/statuses" \
            --jq 'any(.[]; .context == "Dependabot auto-merge" and .creator.login == "github-actions[bot]")')
          validate=$(gh api "repos/$GH_REPO/actions/workflows/validate.yml/runs?head_sha=$SHA&event=pull_request" \
            --jq '.workflow_runs[0].conclusion // "not finished"')
          pr=$(gh pr view "$PR" --json state,headRefOid --jq '.state + " " + .headRefOid')
          echo "Marked: $marked. Validate: $validate. Pull request: $pr."
          if [ "$marked" = true ] && [ "$validate" = success ] && [ "$pr" = "OPEN $SHA" ]; then
            gh pr merge "$PR" --squash --match-head-commit "$SHA"
          fi
