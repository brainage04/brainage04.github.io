name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    uses: brainage04/AstroShell/.github/workflows/site-validate.yml@v0.5.0
    permissions:
      contents: read

  routes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check routes in preview and dev
        run: npm run check:routes
