name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Merges made with the GITHUB_TOKEN (Dependabot's auto-merge) start no push run, so a daily build deploys them.
  schedule:
    - cron: '17 3 * * *'

jobs:
  deploy:
    uses: brainage04/AstroShell/.github/workflows/site-deploy.yml@v0.5.0
    permissions:
      contents: read
      pages: write
      id-token: write
