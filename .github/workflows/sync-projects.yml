name: Sync project catalogue

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: sync-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update project metadata
        run: npm run update-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect catalogue changes
        id: diff
        run: |
          if git diff --quiet -- src/data/projects.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Astro and TypeScript
        if: steps.diff.outputs.changed == 'true'
        run: npm run check

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit catalogue changes
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/projects.generated.ts
          git commit -m 'chore: sync project catalogue'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy the synced commit here.
  deploy:
    needs: sync
    if: needs.sync.outputs.sha != ''
    uses: brainage04/AstroShell/.github/workflows/site-deploy.yml@v0.5.0
    with:
      ref: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
